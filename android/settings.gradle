pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    plugins {
        id 'com.android.application' version '8.1.0'
        id 'org.jetbrains.kotlin.android' version '1.9.0'
    }
}

// Generated by Flutter
rootProject.name = 'vire_langues'
include ':app'

def flutterProjectRoot = rootProject.projectDir

def flutterPluginRoot = rootProject.projectDir.parentFile.parentFile

def flutterPlugins = new Properties()

def pluginsFile = new File(flutterPluginRoot, '.flutter-plugins')
if (pluginsFile.exists()) {
    pluginsFile.withInputStream { input ->
        flutterPlugins.load(input)
    }
}

plugins.each { name, path ->
    def pluginDirectory = flutterPluginRoot.resolve(path).resolve('android')
    include ":$name"
    project(":$name").projectDir = pluginDirectory
}

include ':flutter_local_notifications'
project(':flutter_local_notifications').projectDir = new File(flutterProjectRoot.parent, 'flutter_local_notifications/android')
