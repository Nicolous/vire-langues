def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { instr ->
        localProperties.load(instr)
    }
}

def flutterRoot = localProperties.getProperty('sdk.dir')
if (flutterRoot == null) {
    def flutterDir = rootProject.file('.flutter')
    def flutterFile = flutterDir.file('flutter.gradle')
    if (flutterFile.exists()) {
        new ByteArrayInputStream(flutterFile.text.encode()).withInputStream { instr ->
            localProperties.load(instr)
        }
    }
    flutterRoot = localProperties.getProperty('sdk.dir')
    if (flutterRoot == null) {
        flutterRoot = "${rootProject.projectDir}/../../../flutter"
    } else {
        flutterRoot = "${flutterRoot}"
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace 'com.nicolous.virelangues'
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose false
        viewBinding false
    }

    defaultConfig {
        applicationId "com.nicolous.virelangues"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

flutter {
    android {
        embeddingVersion '2'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0"
    implementation "androidx.multidex:multidex:2.0.1"
}
